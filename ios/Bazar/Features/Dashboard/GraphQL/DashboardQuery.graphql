query Dashboard {
  me {
    firstName
  }
  dashboard {
    totalItems
    itemsByCategory {
      category
      count
    }
    itemsByPlace {
      placeId
      placeName
      count
    }
    recentItems {
      id
      name
      category
      quantity
      addedBy
      createdAt
      location {
        fullPath
      }
    }
    lowStockItems {
      id
      name
      category
      quantity
      lowStockThreshold
      location {
        fullPath
      }
    }
  }
}
