name: Bazar
options:
  bundleIdPrefix: co.polyforms
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.2"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 46C337T7YN

packages:
  Apollo:
    url: https://github.com/apollographql/apollo-ios.git
    minorVersion: "2.3.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.17.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "9.24.0"

targets:
  Bazar:
    type: application
    platform: iOS
    sources:
      - path: Bazar
        excludes:
          - "**/*.graphql"
    dependencies:
      - package: Apollo
        product: Apollo
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.polyforms.bazar
        INFOPLIST_KEY_CFBundleDisplayName: Bazar
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSCameraUsageDescription: "Bazar utilise l'appareil photo pour scanner et identifier vos objets."
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Bazar/Bazar.entitlements
