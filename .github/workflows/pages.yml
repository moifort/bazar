name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 📄 Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # enablement provisions the Pages site on first run, so the workflow does not
      # depend on someone flipping Settings → Pages by hand beforehand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/pages
      - id: deployment
        uses: actions/deploy-pages@v5
